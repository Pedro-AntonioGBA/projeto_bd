<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Ingrediente</title>
    <link th:href="@{/css/estiloPaginaForm.css}" rel="stylesheet" />
</head>
<body>

    <div class="container">
        <h2>Cadastro de Ingrediente</h2>
        
        <!-- Action apontando para ingredientes e objeto ingrediente -->
        <form th:action="@{/ingredientes}" th:object="${ingrediente}" method="post">

            <!-- Campo oculto com o ID do ingrediente (removi a div em volta para não dar espaço em branco na tela) -->
            <input type="hidden" th:field="*{idIngrediente}">

            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}">
            </div>

            <div class="form-group">
                <label for="valor">Valor (R$)</label>
                <!-- O Spring converte o texto para float automaticamente -->
                <input type="text" id="valor" th:field="*{valor}">
            </div>

            <div class="form-group">
                <label for="disponibilidade">Disponível em Estoque?</label>
                <!-- Checkbox é o padrão HTML para campos booleanos (true/false) -->
                <input type="checkbox" id="disponibilidade" th:field="*{disponibilidade}">
            </div>

            <div class="form-group">
                <label for="idFornecedor">Fornecedor</label>
                <!-- Caixa de seleção montada dinamicamente com os fornecedores do banco -->
                <select id="idFornecedor" th:field="*{idFornecedor}">
                    <option value="">Selecione um fornecedor...</option>
                    <option th:each="f : ${fornecedores}" 
                            th:value="${f.id}" 
                            th:text="${f.nome}"></option>
                </select>
            </div>

            <div class="form-group">
                <input type="submit" value="Enviar">
               
                <!-- Botão de cancelar voltando para a lista de ingredientes -->
                <a href="/ingredientes">
                    <input type="button" value="Cancelar">
                </a>
            </div>

        </form>
    </div>

</body>
</html>
