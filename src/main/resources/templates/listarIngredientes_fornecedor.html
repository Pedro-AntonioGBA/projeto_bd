<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Alunos</title>
    <link th:href="@{/css/estiloPaginaListagem.css}" rel="stylesheet" />
</head>
<body>
    <a href="/" class="estiloBotaoLink">Voltar para Página Inicial</a>

    <h2>Listagem de Ingredientes e Fornecedores</h2>

    <table class="tabela-listagem">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Valor</th>
                <th>Disponibilidade</th>
                <th>Forncedor</th>
				<th>Telefone do fornecedor</th>
            </tr>
        </thead>
        <tbody>

                <tr th:each="ingrediente : ${ingrediente_fornecedor}">
					<td th:text="${ingrediente.nome}"></td>
					<td th:text="${ingrediente.valor}"></td>
					<td th:text="${ingrediente.disponibilidade}"></td>
					<td th:text="${ingrediente.nomeFornecedor}"></td>
					<td th:text="${ingrediente.numFornecedor}"></td>
                </tr>
            
        </tbody>
    </table>

</body>
</html>
