<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Fornecedor</title>
    <link th:href="@{/css/estiloPaginaForm.css}" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h2 th:text="${fornecedor.id == null ? 'Novo Fornecedor' : 'Editar Fornecedor'}"></h2>
        
        <form th:action="@{/fornecedores}" th:object="${fornecedor}" method="post">
            <input type="hidden" th:field="*{id}" />
            
            <div class="form-group">
                <label for="cnpj">CNPJ:</label>
                <input type="text" id="cnpj" th:field="*{cnpj}" required>
            </div>
            
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>
            
            <div class="form-group">
                <input type="submit" value="Salvar">
                <a href="/fornecedores">
                    <input type="button" value="Cancelar">
                </a>
            </div>
        </form>
    </div>
</body>
</html>
